<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Agent Web</title>
<style>
  :root {
    --bg: #060a16; --bg2: #0c1530; --panel: rgba(14, 24, 52, .72);
    --line: rgba(160, 180, 255, .16); --text: #e9edf9; --muted: #8e9ac0;
    --red: #e5322d; --red-soft: rgba(229, 50, 45, .35);
    --gold: #f4b942; --gold-soft: rgba(244, 185, 66, .3);
    --navy: #17306b; --ok: #3ddc97; --off: #5a6585;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(1200px 700px at 50% 40%, var(--bg2) 0%, var(--bg) 70%),
      var(--bg);
    min-height: 100vh;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 20px 16px 40px; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    justify-content: space-between; margin-bottom: 14px; }
  h1 { margin: 0; font-size: 22px; letter-spacing: .14em; text-transform: uppercase; }
  h1 span { color: var(--red); }
  .sub { color: var(--muted); font-size: 13px; }
  .pills { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill { border: 1px solid var(--line); background: var(--panel); border-radius: 999px;
    padding: 4px 12px; font-size: 12px; color: var(--muted); }
  .pill b { color: var(--text); font-weight: 650; }

  .layout { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(280px, 1fr); gap: 16px; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }

  .stage { border: 1px solid var(--line); border-radius: 16px; background: var(--panel);
    padding: 8px; backdrop-filter: blur(4px); }
  svg { width: 100%; height: auto; display: block; }
  .ring, .spoke { fill: none; stroke: rgba(170, 190, 255, .20); stroke-width: 1; }
  .spoke { stroke: rgba(170, 190, 255, .16); }
  .thread { fill: none; stroke: var(--navy); stroke-width: 2; }
  .thread.on { stroke: var(--red); stroke-width: 2.4; stroke-dasharray: 6 8;
    animation: flow 1.4s linear infinite; filter: drop-shadow(0 0 4px var(--red)); }
  .link { fill: none; stroke: var(--gold-soft); stroke-width: 1.2; stroke-dasharray: 3 7; }
  @keyframes flow { to { stroke-dashoffset: -28; } }
  @keyframes pulse { 0%,100% { opacity: .35; transform: scale(1); } 50% { opacity: .9; transform: scale(1.12); } }

  .node { cursor: pointer; outline: none; }
  .node .halo { fill: none; stroke: var(--red); stroke-width: 2; opacity: 0;
    transform-box: fill-box; transform-origin: center; }
  .node.active .halo { opacity: .6; animation: pulse 1.8s ease-in-out infinite; }
  .node .disc { fill: #0f1f4a; stroke: var(--gold); stroke-width: 2; transition: stroke .2s, fill .2s; }
  .node.active .disc { stroke: var(--red); fill: #2a1424; }
  .node.error .disc { stroke: #ff6b6b; fill: #3a1218; }
  .node.offline .disc { stroke: var(--off); fill: #10172e; }
  .node:hover .disc, .node:focus-visible .disc, .node.sel .disc { stroke-width: 3.5; fill: #14295f; }
  .node.sel.active .disc { fill: #3a1a2c; }
  .node .num { fill: var(--text); font-size: 16px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
  .node .lbl { fill: var(--muted); font-size: 12px; text-anchor: middle; letter-spacing: .06em; }
  .hub .disc { fill: #1a0f26; stroke: var(--red); stroke-width: 3; }
  .hub .core { fill: var(--red); opacity: .9; }
  .hub .lbl { fill: var(--text); font-size: 12px; text-anchor: middle; letter-spacing: .12em; }

  aside { display: flex; flex-direction: column; gap: 12px; }
  .card { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); padding: 14px; }
  .card h2 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
  .detail .name { font-size: 18px; font-weight: 650; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px;
    font-weight: 600; border: 1px solid var(--line); margin-left: 8px; vertical-align: middle; }
  .badge.active { color: #ffb4b1; border-color: var(--red-soft); background: rgba(229,50,45,.12); }
  .badge.idle { color: var(--gold); border-color: var(--gold-soft); background: rgba(244,185,66,.08); }
  .badge.error { color: #ff8f8f; border-color: rgba(255,107,107,.4); }
  .badge.offline { color: var(--off); }
  dl { margin: 12px 0 0; display: grid; grid-template-columns: 110px 1fr; gap: 6px 10px; font-size: 14px; }
  dt { color: var(--muted); } dd { margin: 0; }
  ul.list { list-style: none; margin: 0; padding: 0; }
  ul.list li { display: flex; align-items: center; gap: 10px; padding: 8px 4px;
    border-top: 1px solid var(--line); cursor: pointer; border-radius: 6px; }
  ul.list li:first-child { border-top: 0; }
  ul.list li:hover, ul.list li:focus-visible { background: rgba(255,255,255,.04); outline: none; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--gold); flex: none; }
  .dot.active { background: var(--red); box-shadow: 0 0 8px var(--red); }
  .dot.error { background: #ff6b6b; } .dot.offline { background: var(--off); }
  ul.list .r { margin-left: auto; color: var(--muted); font-size: 12px; }
  .foot { color: var(--muted); font-size: 12px; margin-top: 12px; }
  @media (prefers-reduced-motion: reduce) {
    .thread.on, .node.active .halo { animation: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Agent <span>Web</span></h1>
      <div class="sub" id="sub">Six agents, one hub</div>
    </div>
    <div class="pills">
      <span class="pill">Active <b id="pActive">0</b></span>
      <span class="pill">Idle <b id="pIdle">0</b></span>
      <span class="pill">Queue <b id="pQueue">0</b></span>
      <span class="pill">Updated <b id="pUpdated">–</b></span>
    </div>
  </header>

  <div class="layout">
    <div class="stage">
      <svg id="web" viewBox="0 0 800 800" role="img" aria-label="Spider-web diagram of the orchestrator and six agents"></svg>
    </div>
    <aside>
      <section class="card detail" id="detail" aria-live="polite"></section>
      <section class="card">
        <h2>All agents</h2>
        <ul class="list" id="list"></ul>
        <div class="foot">Roles are placeholders until each agent is defined.</div>
      </section>
    </aside>
  </div>
</div>

<script>
(function () {
  var NS = "http://www.w3.org/2000/svg";
  var CX = 400, CY = 400, R_NODE = 262, R_OUT = 372, NODE_R = 36;
  var TZ = "Asia/Kolkata";
  var FALLBACK = {
    system: { name: "Agent Web", updated_at: null },
    hub: { name: "Orchestrator", status: "idle", queue: 0 },
    agents: [1,2,3,4,5,6].map(function (n) {
      return { id: "a" + n, name: "Agent 0" + n, role: "Role to be defined",
               status: "idle", task: null, last_active: null, tasks_done: 0 };
    })
  };
  var data = FALLBACK, selected = 0;

  function s(tag, attrs, parent) {
    var n = document.createElementNS(NS, tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }
  function h(tag, text, cls) {
    var n = document.createElement(tag);
    if (text != null) n.textContent = String(text);
    if (cls) n.className = cls;
    return n;
  }
  function pt(r, deg) {
    var a = deg * Math.PI / 180;
    return [CX + r * Math.cos(a), CY + r * Math.sin(a)];
  }
  function okStatus(v) { return ["active", "idle", "error", "offline"].indexOf(v) > -1 ? v : "idle"; }
  function fmt(iso) {
    if (!iso) return "–";
    var d = new Date(iso);
    if (isNaN(d)) return "–";
    return d.toLocaleString("en-IN", { timeZone: TZ, month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  }

  function drawWeb() {
    var svg = document.getElementById("web");
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    var SPOKES = 12, rings = [60, 115, 170, 225, 280, 330, 372];

    var g = s("g", {}, svg);
    for (var i = 0; i < SPOKES; i++) {
      var p = pt(R_OUT, -90 + i * 30);
      s("line", { "class": "spoke", x1: CX, y1: CY, x2: p[0], y2: p[1] }, g);
    }
    rings.forEach(function (r) {
      for (var i = 0; i < SPOKES; i++) {
        var a = pt(r, -90 + i * 30), b = pt(r, -90 + (i + 1) * 30);
        var m = pt(r * 0.90, -90 + i * 30 + 15);
        s("path", { "class": "ring", d: "M" + a[0] + " " + a[1] + " Q" + m[0] + " " + m[1] + " " + b[0] + " " + b[1] }, g);
      }
    });

    var agents = data.agents.slice(0, 6);
    var pos = agents.map(function (_, i) { return pt(R_NODE, -90 + i * 60); });

    // collaboration links between neighbouring agents
    pos.forEach(function (p, i) {
      var q = pos[(i + 1) % pos.length];
      var mid = pt(R_NODE * 0.80, -90 + i * 60 + 30);
      s("path", { "class": "link", d: "M" + p[0] + " " + p[1] + " Q" + mid[0] + " " + mid[1] + " " + q[0] + " " + q[1] }, svg);
    });
    // hub-to-agent threads
    agents.forEach(function (a, i) {
      var st = okStatus(a.status);
      s("line", { "class": "thread" + (st === "active" ? " on" : ""), x1: CX, y1: CY, x2: pos[i][0], y2: pos[i][1] }, svg);
    });

    // hub
    var hub = s("g", { "class": "node hub" }, svg);
    s("circle", { "class": "disc", cx: CX, cy: CY, r: 50 }, hub);
    s("circle", { "class": "core", cx: CX, cy: CY, r: 10 }, hub);
    var ht = s("text", { "class": "lbl", x: CX, y: CY + 74 }, hub);
    ht.textContent = String((data.hub && data.hub.name) || "Orchestrator").toUpperCase();

    // agents
    agents.forEach(function (a, i) {
      var st = okStatus(a.status);
      var n = s("g", { "class": "node " + st + (i === selected ? " sel" : ""), tabindex: 0,
                       role: "button", "aria-label": a.name + ", " + st }, svg);
      s("circle", { "class": "halo", cx: pos[i][0], cy: pos[i][1], r: NODE_R + 8 }, n);
      s("circle", { "class": "disc", cx: pos[i][0], cy: pos[i][1], r: NODE_R }, n);
      var t = s("text", { "class": "num", x: pos[i][0], y: pos[i][1] }, n);
      t.textContent = String(i + 1).padStart(2, "0");
      var l = s("text", { "class": "lbl", x: pos[i][0], y: pos[i][1] + NODE_R + 20 }, n);
      l.textContent = String(a.name).toUpperCase();
      n.addEventListener("click", function () { select(i); });
      n.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(i); }
      });
    });
  }

  function drawDetail() {
    var a = data.agents[selected], el = document.getElementById("detail");
    while (el.firstChild) el.removeChild(el.firstChild);
    var st = okStatus(a.status);
    var top = h("div");
    top.appendChild(h("span", a.name, "name"));
    top.appendChild(h("span", st, "badge " + st));
    el.appendChild(top);
    var dl = h("dl");
    [["Role", a.role || "Role to be defined"],
     ["Current task", a.task || "None"],
     ["Last active", fmt(a.last_active)],
     ["Tasks done", a.tasks_done == null ? 0 : a.tasks_done]].forEach(function (r) {
      dl.appendChild(h("dt", r[0])); dl.appendChild(h("dd", r[1]));
    });
    el.appendChild(dl);
  }

  function drawList() {
    var ul = document.getElementById("list");
    while (ul.firstChild) ul.removeChild(ul.firstChild);
    data.agents.slice(0, 6).forEach(function (a, i) {
      var st = okStatus(a.status);
      var li = h("li"); li.tabIndex = 0;
      li.appendChild(h("span", null, "dot " + st));
      li.appendChild(h("span", a.name));
      li.appendChild(h("span", a.role || "Role to be defined", "r"));
      li.addEventListener("click", function () { select(i); });
      li.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(i); }
      });
      ul.appendChild(li);
    });
  }

  function drawPills() {
    var act = 0, idle = 0;
    data.agents.forEach(function (a) {
      var st = okStatus(a.status);
      if (st === "active") act++; else if (st === "idle") idle++;
    });
    document.getElementById("pActive").textContent = act;
    document.getElementById("pIdle").textContent = idle;
    document.getElementById("pQueue").textContent = (data.hub && data.hub.queue) || 0;
    document.getElementById("pUpdated").textContent = fmt(data.system && data.system.updated_at);
  }

  function select(i) { selected = i; drawWeb(); drawDetail(); }
  function renderAll() { drawWeb(); drawDetail(); drawList(); drawPills(); }

  function load() {
    fetch("agents.json?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (d) {
        if (d && Array.isArray(d.agents) && d.agents.length) {
          data = d;
          if (selected >= data.agents.length) selected = 0;
          renderAll();
        }
      })
      .catch(function () {});
  }
  renderAll();
  load();
  setInterval(load, 30000);
})();
</script>
</body>
</html>
